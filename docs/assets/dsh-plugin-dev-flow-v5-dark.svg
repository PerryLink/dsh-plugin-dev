<text x="348" y="142" fill="#f0f3f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" >dsh-dev &lt;verb&gt; [flags]</text>
<text x="348" y="158" fill="#737b8d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" >--help / -h 短路 → exit 0 · 未知命令 → exit 1</text>
