    <path d="M0 0 L10 5 L0 10 z" fill="#8496f5"/>
  </marker>
  <marker id="arrFaint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#737b8d"/>
  </marker>
  <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#131a2a"/>
    <stop offset="1" stop-color="#0c1016"/>
  </linearGradient>
</defs>
