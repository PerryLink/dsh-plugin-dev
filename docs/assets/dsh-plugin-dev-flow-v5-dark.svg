<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="dsh-plugin-dev dispatch tree: one argv root, a shallow hand-off subtree of four verbs that leave this repository, and a deep orchestration subtree for test (six steps in a temp DSH_HOME) and submit (a five-rung checker ladder); every branch returns one process.exitCode among 0, 1, 2, 3">
<title>dsh-plugin-dev — unbalanced dispatch tree</title>
