<text x="62" y="406" fill="#8496f5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" >转交侧 · 这个仓库不实现这些</text>
<text x="62" y="431" fill="#a8b1c4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" >start / ready / tools 是 package.json 里的普通依赖</text>
<text x="62" y="452" fill="#a8b1c4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" >调用方式是进程内 import main，不是 spawn</text>
<text x="62" y="473" fill="#a8b1c4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" >upgrade 例外：where/which 探测 dsh-codemod</text>
<text x="62" y="494" fill="#a8b1c4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" >没有配置文件、没有 cordis.patch.yml、不挂 profile</text>
<text x="62" y="515" fill="#a8b1c4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" >不安装插件、不跑 UI、不给结论 → 输出自带 notClaimed</text>
<text x="62" y="536" fill="#a8b1c4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" >依赖锁定 start 0.2.1 · ready 0.2.2 · tools 0.2.2</text>
